name: "SVG to PNG Converter"
version: "1.2.1"
slug: "svg-to-png"
description: "Convert Material Design Icons SVG to PNG for Home Assistant notifications"
url: "https://github.com/Netesfiu/hass-addons/tree/master/svg-to-png"

arch:
  - aarch64
  - amd64

init: false
startup: services
boot: auto
stage: stable

# The HTTP port is the point of the app: notification image URLs must be
# reachable from a phone, which has no Home Assistant session.
ports:
  3000/tcp: 3000
webui: "http://[HOST]:[PORT:3000]"
watchdog: "http://[HOST]:[PORT:3000]/health"

# Authenticated panel inside Home Assistant
ingress: true
ingress_port: 3000
panel_icon: "mdi:image-outline"
panel_title: "SVG to PNG"

hassio_api: true
hassio_role: default
apparmor: true

options: {}
schema: {}
